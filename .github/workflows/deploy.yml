name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Hidden redesign. Built from its own branch into dist/preview so the
      # root site is the main build, unchanged. Do not check this branch out
      # as the root of the job.
      - uses: actions/checkout@v4
        with:
          ref: cursor/restructure-thesis-site-799e
          path: preview-src
      - name: Build hidden /preview
        working-directory: preview-src
        run: |
          npm ci
          PREVIEW_BASE=/preview npm run build
          node scripts/preview-base.mjs
          mkdir -p "$GITHUB_WORKSPACE/dist/preview"
          cp -a dist/. "$GITHUB_WORKSPACE/dist/preview/"
          if grep -q 'noindex' "$GITHUB_WORKSPACE/dist/index.html"; then
            echo "Root homepage was marked noindex. Aborting."
            exit 1
          fi
          if ! grep -q 'noindex, nofollow' "$GITHUB_WORKSPACE/dist/preview/index.html"; then
            echo "Preview homepage is missing noindex."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
